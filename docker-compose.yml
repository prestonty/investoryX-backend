services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - investoryx_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot setup: applies migrations, then seeds the stocks table if it's empty
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "-c", "alembic upgrade head && python -m src.services.seed --if-empty"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DISABLE_EMAIL_VERIFICATION: ${DISABLE_EMAIL_VERIFICATION:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      # Task results live in Postgres (durable); Redis only carries the queue.
      CELERY_RESULT_BACKEND: db+${DATABASE_URL}
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "debug", "--access-log", "--reload"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      # Task results live in Postgres (durable); Redis only carries the queue.
      CELERY_RESULT_BACKEND: db+${DATABASE_URL}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-America/New_York}
    command: ["celery", "-A", "src.celery_app.app", "worker", "-l", "info", "--pool=solo"]
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      # Task results live in Postgres (durable); Redis only carries the queue.
      CELERY_RESULT_BACKEND: db+${DATABASE_URL}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-America/New_York}
      CELERY_BEAT_ENABLED: ${CELERY_BEAT_ENABLED:-true}
    command: ["celery", "-A", "src.celery_app.app", "beat", "-l", "info"]
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    # Cache/rate-limit keys all have TTLs, so volatile-lru evicts them first and
    # never evicts Celery's queue (which has no TTLs). Match this on Railway.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment:
      - "REDIS_HOSTS=local:redis:6379"
    depends_on:
      - redis

volumes:
  investoryx_db:
